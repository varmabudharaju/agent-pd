[project]
name = "agent-pd"
version = "0.1.0"
description = "A police department for Claude Code subagents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Sai Ram Varma Budharaju", email = "sairam.vzf33@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["PyYAML>=6.0"]

# Optional: only needed for `pd judge` (the off_task LLM judge). Core stays zero-dep.
[project.optional-dependencies]
judge = ["anthropic>=0.45"]   # structured-output `output_config`; judge_records also guards the call

[project.scripts]
pd = "agent_pd.cli:main"

[tool.setuptools.packages.find]
# Flat layout: only ship the package, not tests/docs/examples (or any stray dir).
include = ["agent_pd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
