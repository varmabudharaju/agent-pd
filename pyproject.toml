[project]
name = "agent-pd"
version = "0.1.0"
description = "A police department for Claude Code subagents"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

# Optional: only needed for `pd judge` (the off_task LLM judge). Core stays zero-dep.
[project.optional-dependencies]
judge = ["anthropic>=0.40"]

[project.scripts]
pd = "agent_pd.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
