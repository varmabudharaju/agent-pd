[project]
name = "agent-pd"
version = "0.1.0"
description = "A police department for your Claude Code agents — a logging hook + CLI that audits what the main agent and its subagents actually did."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Sai Ram Varma Budharaju", email = "sairam.vzf33@gmail.com"}]
keywords = [
    "claude", "claude-code", "anthropic", "ai-agents", "agent", "subagent",
    "observability", "audit", "audit-log", "security", "llm", "hooks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = ["PyYAML>=6.0"]

# Optional: only needed for `pd judge` (the off_task LLM judge). Core stays zero-dep.
[project.optional-dependencies]
judge = ["anthropic>=0.45"]   # structured-output `output_config`; judge_records also guards the call

[project.urls]
Homepage = "https://github.com/varmabudharaju/agent-pd"
Repository = "https://github.com/varmabudharaju/agent-pd"
Issues = "https://github.com/varmabudharaju/agent-pd/issues"
Documentation = "https://github.com/varmabudharaju/agent-pd#readme"
Changelog = "https://github.com/varmabudharaju/agent-pd/blob/master/CHANGELOG.md"

[project.scripts]
pd = "agent_pd.cli:main"

[tool.setuptools.packages.find]
# Flat layout: only ship the package, not tests/docs/examples (or any stray dir).
include = ["agent_pd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]   # SPDX `license` expression + `license-files` support
build-backend = "setuptools.build_meta"
