# pd-rules.yaml — agent-pd rules. All keys optional; omitted keys use built-in defaults.
scope_dirs: []                       # e.g. ["src/", "tests/"]; empty disables the allowlist check
project_boundary: true               # flag any file/Bash path outside the project (git root or cwd)
sensitive_patterns:                  # always flagged (critical) even inside the project
  - "~/.ssh"
  - "~/.aws"
  - "~/.gnupg"
  - "~/.kube"
  - "~/.config"
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "id_rsa"
  - "id_ed25519"
  - "*.p12"
  - ".netrc"
  - ".npmrc"
  - ".pypirc"
  - ".git-credentials"
  - "*.keychain"
escalation_patterns:
  - dangerouslyDisableSandbox
  - "sudo "
  - "chmod 777"
  - "rm -rf /"
severity:
  permission_bypass: critical
  out_of_scope: high
  out_of_scope_sensitive: critical
  redundant: low
  off_task: review
  self_permission: critical
  tool_not_allowed: high
  permitted: info        # downgrade target when an access matches a permission allow-rule
detectors:
  permission_bypass: true
  out_of_scope: true
  redundant: true
  off_task: true
  self_permission: true
  tool_not_allowed: true
off_task_overlap_threshold: 0.15
